name: Test Build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2
      - name: Build
        run: mdbook build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./book
          retention-days: 3
